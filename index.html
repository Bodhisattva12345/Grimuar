<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тактический Гримуар</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background-color: #4a423a; font-family: 'Lora', serif; }
        .font-lora { font-family: 'Lora', serif; }
        .font-playfair { font-family: 'Playfair Display', serif; }
        .monster-name-style { text-shadow: 1px 1px 2px rgba(0,0,0,0.5); cursor: pointer; }
        .card { transition: box-shadow 0.3s ease-in-out, transform 0.3s ease-in-out, opacity 0.3s ease-in-out; position: relative; }
        .defeated .card-content {
            filter: grayscale(100%);
            opacity: 0.6;
            transition: all 0.3s ease-in-out;
        }
        .defeated-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: rgba(0, 0, 0, 0.5); /* Added background for visibility */
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 5;
             cursor: pointer; /* Allow clicking to remove */
        }
        /* XP display styles removed */
        .color-palette { position: absolute; display: none; grid-template-columns: repeat(4, 1fr); gap: 4px; background-color: #E0DACE; border: 2px solid #3D352E; padding: 4px; border-radius: 6px; z-index: 10; right: 28px; top: 28px; }
        .color-swatch { width: 20px; height: 20px; border-radius: 50%; cursor: pointer; border: 1px solid #3D352E; }
        /* Debuff button styles removed */
        /* Debuff list styles removed */
        /* Modal styles removed */
        .btn-feedback { transition: background-color 0.2s ease-in-out; }
        #creation-form-container {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.5s ease-in-out;
        }
        .level-input-container label, .quantity-input-container label {
             white-space: nowrap;
        }
         .level-input-container input, .quantity-input-container input {
             width: 4rem; /* Adjust width as needed */
        }
         .notes-input {
             font-size: 10px;
             padding: 2px 4px;
             background-color: #f3efe6; /* Slightly lighter than card */
             border: 1px solid #c9c1b4;
             border-radius: 3px;
        }
        /* Style for the oval color picker button */
        .color-picker-button-oval {
             height: 1rem; /* h-4 */
             width: 4rem; /* w-16 - Made 4 times wider than height */
             border-radius: 9999px; /* rounded-full */
             border-width: 2px;
        }
        /* Helper class for compact form layout */
        .form-grid-compact {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 0.5rem; /* Reduced gap */
        }
        .form-grid-compact > div {
             margin-bottom: 0.25rem; /* Reduced bottom margin */
        }
         .form-grid-compact label {
             margin-bottom: 0.1rem; /* Reduced label margin */
             font-size: 0.7rem; /* Smaller label font */
        }
         .form-grid-compact input[type=text],
         .form-grid-compact input[type=number] {
             padding: 0.2rem 0.4rem; /* Smaller padding */
             font-size: 0.8rem; /* Smaller input font */
        }
         #creation-form h4 {
            margin-top: 0.5rem; /* Reduced top margin for headers */
            margin-bottom: 0.25rem;
            font-weight: normal; /* Changed to normal */
            font-size: 0.75rem; /* text-xs */
         }
         /* Style adjustments for stat labels and inputs */
        .stat-label {
            font-size: 0.65rem !important; /* Even smaller font size */
            font-weight: normal !important; /* Ensure normal font weight */
        }
        .stat-input {
             font-size: 0.75rem !important; /* text-xs */
             padding: 0.1rem 0.2rem !important; /* Smaller padding */
         }


    </style>
</head>
<body class="p-4 sm:p-6 md:p-8">

    <div class="max-w-7xl mx-auto">
        <div class="bg-[#E0DACE] p-4 sm:p-6 rounded-lg border-2 border-[#3D352E] shadow-lg mb-8">
            <h1 class="font-playfair text-2xl sm:text-3xl font-bold text-[#3D352E] text-center mb-4">Тактический Гримуар</h1>

            <form id="add-monster-form">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="monster-select" class="block text-sm font-bold text-[#3D352E]">Выбор из бестиария</label>
                        <select id="monster-select" class="mt-1 block w-full rounded-md border-[#3D352E] shadow-sm bg-stone-50">
                            <option value="">-- Создать своего --</option>
                        </select>
                    </div>
                    <div class="flex items-end">
                         <button type="button" id="toggle-creation-form" class="w-full bg-[#5a4d41] text-white font-bold py-2 px-4 rounded-lg hover:bg-[#3D352E] transition-colors duration-300 shadow-md">Создать / Изменить Существо ▼</button>
                    </div>
                </div>

                <div id="creation-form-container">
                    <!-- Форма создания/редактирования - Compact Layout -->
                    <div id="creation-form" class="mt-4 pt-4 border-t-2 border-[#3D352E] space-y-2"> <!-- Reduced space-y -->
                        <div class="form-grid-compact">
                             <div><label class="block">Имя</label><input type="text" id="form-name" class="w-full rounded border-[#3D352E]" required></div>
                             <div><label class="block">Здоровье</label><input type="number" id="form-hp" class="w-full rounded border-[#3D352E]" placeholder="Авто (уровень)"></div>
                             <div><label class="block">Уровень (ред.)</label><input type="number" id="form-level" class="w-full rounded border-[#3D352E]"></div>
                             <div><label class="block">Иммунитет</label><input type="text" id="form-immunity" class="w-full rounded border-[#3D352E]"></div>
                             <div><label class="block">Скорость</label><input type="number" id="form-speed" class="w-full rounded border-[#3D352E]"></div>
                             <div><label class="block">Лидерство</label><input type="number" id="form-leadership" class="w-full rounded border-[#3D352E]"></div>
                        </div>

                        <div>
                            <!-- Removed h4 "Характеристики" -->
                            <div class="grid grid-cols-5 gap-1 mt-2"> <!-- Added margin-top -->
                                <div><label class="block text-center stat-label">СИЛ</label><input type="number" id="form-stat-str" class="w-full rounded border-[#3D352E] text-center stat-input"></div>
                                <div><label class="block text-center stat-label">ЛОВ</label><input type="number" id="form-stat-dex" class="w-full rounded border-[#3D352E] text-center stat-input"></div>
                                <div><label class="block text-center stat-label">ВЫН</label><input type="number" id="form-stat-con" class="w-full rounded border-[#3D352E] text-center stat-input"></div>
                                <div><label class="block text-center stat-label">ИНТ</label><input type="number" id="form-stat-int" class="w-full rounded border-[#3D352E] text-center stat-input"></div>
                                <div><label class="block text-center stat-label">ХАР</label><input type="number" id="form-stat-cha" class="w-full rounded border-[#3D352E] text-center stat-input"></div>
                            </div>
                        </div>
                         <div>
                             <!-- Attack header -->
                             <h4 class="text-center">Атаки</h4>
                             <!-- Button "Добавить атаку" removed -->
                            <div id="attacks-input-container" class="space-y-1 mt-1"></div> <!-- Reduced space-y and added margin-top -->
                        </div>
                        <div>
                             <!-- Ability header -->
                             <h4 class="text-center">Способности</h4>
                             <!-- Button "Добавить способность" removed -->
                            <div id="abilities-input-container" class="space-y-1 mt-1"></div> <!-- Reduced space-y and added margin-top -->
                        </div>
                    </div>
                </div>

                <div class="flex items-center justify-between gap-4 mt-4">
                     <button type="submit" class="flex-1 bg-[#3D352E] text-white font-bold py-2 px-4 rounded-lg hover:bg-[#5a4d41] transition-colors duration-300 shadow-md">Добавить в бой</button>
                    <div class="flex items-center gap-4">
                        <div class="flex items-center gap-2 level-input-container">
                            <label for="monster-level-input" class="text-sm font-bold text-[#3D352E]">Уровень:</label>
                            <input type="number" id="monster-level-input" value="1" min="1" max="14" class="rounded-md border-[#3D352E] shadow-sm text-center p-1">
                        </div>
                        <div class="flex items-center gap-2 quantity-input-container">
                            <label for="quantity" class="text-sm font-bold text-[#3D352E]">Кол-во:</label>
                            <input type="number" id="quantity" value="1" min="1" class="rounded-md border-[#3D352E] shadow-sm text-center p-1">
                        </div>
                    </div>
                </div>
            </form>
        </div>
        <div id="cards-container" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-4 justify-items-center"></div>
    </div>

    <!-- Модальное окно и шаблоны (Debuff modal removed) -->

    <template id="attack-input-template">
         <!-- Slightly adjusted compact layout for attack row -->
        <div class="attack-input-row grid grid-cols-12 gap-1 items-center">
            <select class="form-attack-type col-span-3 rounded border-[#3D352E] p-1 text-xs">
                <option value="сил">СИЛ</option><option value="лов">ЛОВ</option><option value="инт">ИНТ</option>
            </select>
             <!-- Placeholder added for first attack damage -->
            <input type="text" class="form-attack-damage col-span-3 rounded border-[#3D352E] p-1 text-xs" placeholder="Авто (уровень)">
            <input type="text" class="form-attack-desc col-span-5 rounded border-[#3D352E] p-1 text-xs" placeholder="Описание">
            <button type="button" class="remove-btn col-span-1 text-red-600 font-bold">×</button>
        </div>
    </template>

    <template id="ability-input-template">
         <!-- Slightly adjusted compact layout for ability row -->
        <div class="ability-input-row grid grid-cols-12 gap-1 items-center">
            <input type="text" class="form-ability-name col-span-4 rounded border-[#3D352E] p-1 text-xs" placeholder="Название">
            <input type="text" class="form-ability-desc col-span-7 rounded border-[#3D352E] p-1 text-xs" placeholder="Описание">
            <button type="button" class="remove-btn col-span-1 text-red-600 font-bold">×</button>
        </div>
    </template>


    <template id="card-template">
        <div class="card flex flex-col gap-1.5 bg-[#E0DACE] border-2 border-[#3D352E] rounded-lg shadow-xl p-3 font-lora text-sm text-[#3D352E] w-full max-w-xs">
             <!-- XP display removed from overlay -->
            <div class="defeated-overlay"></div>
            <div class="card-content flex flex-col gap-1.5">
                <div class="flex items-center justify-between">
                    <h2 class="monster-name font-playfair font-bold text-sm text-[#3D352E] monster-name-style">Имя существа</h2>
                    <div class="flex items-center gap-2 relative">
                        <!-- Debuff button removed -->
                        <div class="color-picker-wrapper">
                             <!-- Color picker button changed to oval -->
                            <button class="color-picker-button-oval border-[#3D352E] bg-[#3D352E]"></button>
                            <div class="color-palette"></div>
                        </div>
                        <button class="delete-button font-bold text-2xl leading-none text-[#3D352E] hover:text-red-700">×</button>
                    </div>
                </div>
                <!-- Debuff list removed -->
                <div class="text-center">
                    <p class="hp-text font-bold text-[14px]"><span class="text-[#A02828] text-[13px]">❤️</span> <span class="current-hp">20</span> / <span class="max-hp">20</span></p>
                    <div class="health-bar-background bg-[#3D352E] rounded-full h-2 overflow-hidden mt-1">
                        <div class="health-bar-fill bg-[#4CAF50] h-full rounded-full transition-all duration-300"></div>
                    </div>
                </div>
                <div class="grid grid-cols-5 gap-2">
                    <button class="heal-button flex items-center justify-center w-8 h-8 rounded bg-[#388E3C] text-white font-bold text-lg shadow hover:bg-green-700">❤️</button>
                    <input type="number" placeholder="Исцеление/Урон" class="damage-input col-span-3 rounded border border-[#3D352E] text-center p-1 bg-stone-50" style="font-size: 11px;">
                    <button class="damage-button flex items-center justify-center w-8 h-8 rounded bg-[#C53030] text-white font-bold text-lg shadow hover:bg-red-700">⚔️</button>
                </div>
                <div class="details-section flex flex-col gap-2 pt-2">
                     <!-- Defense block removed -->
                    <div class="attacks-container border-t border-[#3D352E] pt-1.5"></div>
                    <div>
                        <p class="initiative-text text-center text-xs font-bold">Инициатива: 0</p>
                        <!-- Speed and Leadership removed -->
                    </div>
                    <!-- Notes Section Added -->
                    <div class="notes-section border-t border-[#3D352E] pt-1.5 mt-1 space-y-1">
                         <!-- "Заметки:" label removed -->
                        <div class="grid grid-cols-3 gap-1">
                             <input type="text" class="notes-input col-span-2" placeholder=""> <!-- Placeholder removed -->
                             <input type="text" class="notes-input col-span-1" placeholder=""> <!-- Placeholder removed -->
                        </div>
                         <div class="grid grid-cols-3 gap-1">
                             <input type="text" class="notes-input col-span-2" placeholder=""> <!-- Placeholder removed -->
                             <input type="text" class="notes-input col-span-1" placeholder=""> <!-- Placeholder removed -->
                        </div>
                         <div class="grid grid-cols-3 gap-1">
                             <input type="text" class="notes-input col-span-2" placeholder=""> <!-- Placeholder removed -->
                             <input type="text" class="notes-input col-span-1" placeholder=""> <!-- Placeholder removed -->
                        </div>
                         <div class="grid grid-cols-3 gap-1">
                             <input type="text" class="notes-input col-span-2" placeholder=""> <!-- Placeholder removed -->
                             <input type="text" class="notes-input col-span-1" placeholder=""> <!-- Placeholder removed -->
                        </div>
                    </div>
                     <!-- Sub-details section removed -->
                </div>
            </div>
        </div>
    </template>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Таблица характеристик по уровням - ОБНОВЛЕНА
            const levelStatsTable = {
                1: { hp: 8, damage: '1d8' },  // Урон изменен
                2: { hp: 14, damage: '1d12' }, // Урон изменен
                3: { hp: 20, damage: '2d6' },
                4: { hp: 26, damage: '2d8' },
                5: { hp: 32, damage: '2d10' },
                6: { hp: 38, damage: '3d8' },
                7: { hp: 44, damage: '3d8' },
                8: { hp: 50, damage: '3d10' },
                9: { hp: 56, damage: '3d10' },
                10: { hp: 62, damage: '3d12' },
                11: { hp: 68, damage: '3d12' },
                12: { hp: 74, damage: '4d10' },
                13: { hp: 80, damage: '4d12' },
                14: { hp: 86, damage: '5d10' }
            };

             const bestiary = { // Base stats for editor population (Orc HP/Damage are base BEFORE buffs)
                 'Крыса': { name: 'Крыса', hp: 12, speed: 30, leadership: 4, immunity: 'Болезни', stats: { str: 6, dex: 11, con: 12, int: 2, cha: 5 }, attacks: [{ type: 'лов', damage: '1d4', desc: 'ближний бой' }], abilities: [{ name: 'Прыжок из тени', desc: 'Если крыса была скрыта, она прыгает на 15 фт. и атакует с преимуществом.' }] },
                 'Волк': { name: 'Волк', hp: 18, speed: 35, leadership: 7, immunity: 'Страх', stats: { str: 14, dex: 15, con: 15, int: 3, cha: 7 }, attacks: [{ type: 'лов', damage: '1d4', desc: 'ближний бой' }], abilities: [{ name: 'Звериный вой (1р/бой)', desc: 'Все дружественные волки в радиусе 60 фт. получают Преимущество на одну атаку.' }] },
                 'Варг': { name: 'Варг', hp: 30, speed: 40, leadership: 5, immunity: 'Страх', stats: { str: 16, dex: 15, con: 16, int: 3, cha: 7 }, attacks: [{ type: 'сил', damage: '1d8', desc: 'ближний бой' }], abilities: [{ name: 'Свирепость', desc: 'Если Варг получает урон, он получает преимущество на следующую атаку.' }] },
                 'Паук': { name: 'Паук', hp: 20, speed: 35, leadership: 7, immunity: 'Яд', stats: { str: 10, dex: 13, con: 12, int: 2, cha: 4 }, attacks: [{ type: 'лов', damage: '1d6', desc: 'ближний бой' }], abilities: [{ name: 'Парализующий яд', desc: 'Проверка Вын. (9)— если провал, цель парализована до конца следующего хода.' }] },
                 'Ползун': { name: 'Ползун', hp: 14, speed: 30, leadership: 8, immunity: 'Психическая магия', stats: { str: 8, dex: 14, con: 10, int: 1, cha: 1 }, attacks: [{ type: 'лов', damage: '1d6', desc: 'ближний бой' }], abilities: [{ name: 'Шепот глубин (1р/бой)', desc: 'Цель в 30 фт. делает проверку Харизмы (12); при провале получает магический урон и становится растерянной на 1 раунд.' }] },
                 'Орк': { name: 'Орк', hp: 25, speed: 30, leadership: 2, immunity: '-', stats: { str: 16, dex: 10, con: 16, int: 7, cha: 8 }, attacks: [{ type: 'сил', damage: '1d8', desc: 'ближний бой' }], abilities: [{ name: 'Ярость (1/бой)', desc: 'Когда ХП ниже 50%, наносит доп. урон.' }] },
                 'Орк-воин': { name: 'Орк-воин', hp: 40, speed: 30, leadership: 3, immunity: 'Испуг', stats: { str: 18, dex: 12, con: 17, int: 8, cha: 9 }, attacks: [{ type: 'сил', damage: '1d10', desc: 'ближний бой' }], abilities: [{ name: 'Устрашающий вид', desc: 'При первой атаке цель должна пройти проверку Хар (10) или испугаться.' }, { name: 'Круговой удар (1/бой)', desc: 'Наносит урон всем противникам в радиусе 10 футов.' }] }, // Base damage reverted
                 'Орк-шаман': { name: 'Орк-шаман', hp: 30, speed: 30, leadership: 4, immunity: '-', stats: { str: 12, dex: 10, con: 15, int: 16, cha: 12 }, attacks: [{ type: 'инт', damage: '1d8', desc: 'Магия (огонь)' }], abilities: [{ name: 'Лечение (1/бой)', desc: 'Восстанавливает Здоровье себе или союзному орку.' }, { name: 'Огненный дождь', desc: 'Призывает огненный дождь на область.' }] },
                 'Скелет': { name: 'Скелет', hp: 28, speed: 30, leadership: 0, immunity: 'Яд, Истощение', stats: { str: 12, dex: 16, con: 16, int: 6, cha: 5 }, attacks: [{ type: 'лов', damage: '1d8', desc: 'ближний бой' }], abilities: [{ name: 'Нежить', desc: 'Иммунитет к яду и истощению.' }] },
                 'Маг Скелет': { name: 'Маг Скелет', hp: 25, speed: 30, leadership: 0, immunity: 'Яд, Истощение', stats: { str: 8, dex: 15, con: 15, int: 16, cha: 8 }, attacks: [{ type: 'инт', damage: '1d8', desc: 'Магия (холод)' }], abilities: [{ name: 'Ледяная стрела', desc: 'Цель должна совершить спасбросок Выносливости (13), иначе ее скорость передвижения уменьшается вдвое до конца ее следующего хода.' }] },
                 'Человек': { name: 'Человек', hp: 13, speed: 25, leadership: 0, immunity: '-', stats: { str: 10, dex: 11, con: 12, int: 8, cha: 9 }, attacks: [{ type: 'сил', damage: '1d6', desc: 'ближний бой' }], abilities: [{ name: 'Сдержанная паника', desc: 'При Здоровье 3 или меньше получает преимущество на спасброски.' }] }
             };
            const colorPalette = { 'Красный': '#C53030', 'Синий': '#3B82F6', 'Зеленый': '#10B981', 'Желтый': '#F59E0B', 'Черный': '#1F2937', 'Серый': '#6B7280', 'Белый': '#F9FAFB' };
            const attackTypeMap = { 'лов': 'Ловкость', 'сил': 'Сила', 'инт': 'Интеллект' };

             // Orc Buff Multipliers
             const orcHpMultiplier = {
                 'Орк': 1.15,
                 'Орк-воин': 1.35,
                 'Орк-шаман': 1.15
             };
             // Orc warrior special damage removed from here

            // Form Elements
            const form = document.getElementById('add-monster-form');
            const monsterSelect = document.getElementById('monster-select');
            const quantityInput = document.getElementById('quantity');
            const monsterLevelInput = document.getElementById('monster-level-input');
            const toggleCreationFormBtn = document.getElementById('toggle-creation-form');
            const creationFormContainer = document.getElementById('creation-form-container');

            // Card Elements
            const cardsContainer = document.getElementById('cards-container');
            const cardTemplate = document.getElementById('card-template');

            // Modal Elements removed

            // Templates for dynamic inputs
            const attackInputTemplate = document.getElementById('attack-input-template');
            const abilityInputTemplate = document.getElementById('ability-input-template');

            const calculateModifier = (stat) => Math.floor((stat - 10) / 2);
            const calculateBaseInitiative = (stats, leadership) => {
                 const dexMod = stats && stats.dex ? calculateModifier(stats.dex) : 0;
                 const chaMod = stats && stats.cha ? calculateModifier(stats.cha) : 0;
                 const lead = typeof leadership === 'number' ? leadership : 0;
                 return dexMod + chaMod + lead;
            };

            // Function to update placeholders based on level and selected monster
             function updatePlaceholders(level, monsterName) {
                 const statsForLevel = levelStatsTable[level] || levelStatsTable[1];
                 let calculatedHp = statsForLevel.hp;
                 let calculatedDamage = statsForLevel.damage; // Default damage from level table
                 const isOrcWarrior = monsterName === 'Орк-воин';

                 // Apply HP buff for placeholder calculation if it's an Orc type
                 if (monsterName in orcHpMultiplier) {
                     calculatedHp = Math.round(calculatedHp * orcHpMultiplier[monsterName]);
                 }
                 // Orc warrior specific damage placeholder logic removed

                 // Add damage bonus to placeholder for Orc Warrior
                 let damageBonusString = "";
                 if (isOrcWarrior) {
                     if (level >= 1 && level <= 4) damageBonusString = " +2";
                     else if (level >= 5 && level <= 8) damageBonusString = " +4";
                     else if (level >= 9 && level <= 14) damageBonusString = " +8";
                 }

                 document.getElementById('form-hp').placeholder = `Авто (~${calculatedHp})`;
                 const firstAttackDamageInput = document.querySelector('#attacks-input-container .form-attack-damage');
                 if (firstAttackDamageInput) {
                      // Show level-based damage + bonus in placeholder
                     firstAttackDamageInput.placeholder = `Авто (${calculatedDamage}${damageBonusString})`;
                 }
             }


            function populateBestiarySelect() {
                Object.values(bestiary).sort((a, b) => a.name.localeCompare(b.name)).forEach(monster => {
                    const option = document.createElement('option');
                    option.value = monster.name;
                    option.textContent = monster.name;
                    monsterSelect.appendChild(option);
                });
            }
            populateBestiarySelect();

            // Predefined debuffs population removed

            const addAttackInput = (attack = { type: 'сил', damage: '', desc: '' }) => {
                const container = document.getElementById('attacks-input-container');
                 // Only add the first attack input by default, buttons removed
                 if (container.children.length >= 1) {
                     // If an attack row already exists, just update its placeholder
                     const firstDamageInput = container.querySelector('.form-attack-damage');
                     if(firstDamageInput) {
                        // Placeholder updated dynamically by updatePlaceholders
                     }
                     return;
                 }


                const clone = attackInputTemplate.content.cloneNode(true);
                const damageInput = clone.querySelector('.form-attack-damage');
                clone.querySelector('.form-attack-type').value = attack.type;
                damageInput.value = attack.damage;
                 damageInput.placeholder = "Авто (уровень)"; // Placeholder will be updated dynamically

                clone.querySelector('.form-attack-desc').value = attack.desc;
                 // Remove button logic simplified
                 clone.querySelector('.remove-btn').onclick = (e) => {
                      e.target.closest('.attack-input-row').remove();
                      // We need to add back an empty row if the user deletes the only one
                      if (container.children.length === 0) {
                          addAttackInput(); // Add a new empty one
                           updatePlaceholders(parseInt(monsterLevelInput.value) || 1, monsterSelect.value); // Update its placeholder
                      }
                  }
                container.appendChild(clone);
            };


            const addAbilityInput = (ability = { name: '', desc: '' }) => {
                const container = document.getElementById('abilities-input-container');
                 // Limit to 2 ability slots
                 if (container.children.length >= 2) return;

                const clone = abilityInputTemplate.content.cloneNode(true);
                clone.querySelector('.form-ability-name').value = ability.name;
                clone.querySelector('.form-ability-desc').value = ability.desc;
                clone.querySelector('.remove-btn').onclick = (e) => e.target.closest('.ability-input-row').remove();
                container.appendChild(clone);
            };

            // Buttons removed from global scope

            const clearCreationForm = () => {
                document.getElementById('form-name').value = '';
                document.getElementById('form-hp').value = '';
                 updatePlaceholders(1, ''); // Update placeholders for level 1, no specific monster
                document.getElementById('form-level').value = '1';
                // XP field removed
                // Defense fields removed
                document.getElementById('form-immunity').value = '';
                document.getElementById('form-speed').value = '30';
                document.getElementById('form-leadership').value = '0';
                ['str', 'dex', 'con', 'int', 'cha'].forEach(stat => document.getElementById(`form-stat-${stat}`).value = '10');
                document.getElementById('attacks-input-container').innerHTML = '';
                document.getElementById('abilities-input-container').innerHTML = '';
                addAttackInput({ type: 'сил', damage: '', desc: '' }); // Add one attack slot
                for (let i = 0; i < 2; i++) { addAbilityInput(); } // Default 2 ability slots
            };

            const populateCreationForm = (monsterData) => {
                document.getElementById('form-name').value = monsterData.name || '';
                document.getElementById('form-hp').value = ''; // Clear HP field
                // Level is 1 initially when populating
                updatePlaceholders(1, monsterData.name); // Update placeholders for level 1 FOR THIS MONSTER

                document.getElementById('form-level').value = ''; // Clear level field
                // XP field removed
                // Defense fields removed
                document.getElementById('form-immunity').value = monsterData.immunity || '';
                document.getElementById('form-speed').value = monsterData.speed || '30';
                document.getElementById('form-leadership').value = monsterData.leadership || '0';
                Object.entries(monsterData.stats || {}).forEach(([key, value]) => {
                     const inputElement = document.getElementById(`form-stat-${key}`);
                     if (inputElement) {
                        inputElement.value = value;
                     }
                });
                document.getElementById('attacks-input-container').innerHTML = '';
                 // Populate only the first attack slot, leaving damage empty
                 if (monsterData.attacks && monsterData.attacks.length > 0) {
                     addAttackInput({ ...monsterData.attacks[0], damage: '' }); // Damage is empty, placeholder will show default/buffed
                 } else {
                     addAttackInput(); // Add empty slot if no attacks defined
                 }


                document.getElementById('abilities-input-container').innerHTML = '';
                const existingAbilities = monsterData.abilities || [];
                existingAbilities.forEach(addAbilityInput); // Add existing
                 // Ensure exactly 2 slots total
                const abilitiesToPad = Math.max(0, 2 - existingAbilities.length);
                if (abilitiesToPad > 0) {
                    for (let i = 0; i < abilitiesToPad; i++) {
                        addAbilityInput();
                    }
                }
            };


            monsterSelect.addEventListener('change', (e) => {
                const selectedName = e.target.value;
                monsterLevelInput.value = 1; // Reset level input on selection change
                if (!selectedName) {
                    clearCreationForm();
                    return;
                }
                const monsterData = bestiary[selectedName];
                if (monsterData) {
                    populateCreationForm(monsterData);
                }
                 updatePlaceholders(1, selectedName); // Explicitly update placeholders after populating
            });

             // Update placeholders when level changes
             monsterLevelInput.addEventListener('change', (e) => {
                 const level = parseInt(e.target.value) || 1;
                 const selectedMonsterName = monsterSelect.value; // Get current monster name
                 updatePlaceholders(level, selectedMonsterName); // Update placeholders for the selected monster and new level
             });


            toggleCreationFormBtn.addEventListener('click', () => {
                if (creationFormContainer.style.maxHeight) {
                    creationFormContainer.style.maxHeight = null;
                    toggleCreationFormBtn.textContent = 'Создать / Изменить Существо ▼';
                } else {
                    creationFormContainer.style.maxHeight = creationFormContainer.scrollHeight + "px";
                    toggleCreationFormBtn.textContent = 'Скрыть Редактор ▲';
                }
            });

             form.addEventListener('submit', (e) => {
                 e.preventDefault();
                 const selectedLevel = parseInt(monsterLevelInput.value) || 1;
                 const levelStats = levelStatsTable[selectedLevel] || levelStatsTable[1];
                 const selectedMonsterName = monsterSelect.value;
                 const isCreatingNew = !selectedMonsterName;
                 const finalMonsterName = document.getElementById('form-name').value || (selectedMonsterName || 'Безымянный'); // Get final name
                 const isOrcWarrior = finalMonsterName === 'Орк-воин'; // Check final name


                 // --- Start: Сбор данных ИЗ ФОРМЫ ---
                 let formData = {
                     name: finalMonsterName,
                     hp: parseInt(document.getElementById('form-hp').value), // Get HP from form initially
                     immunity: document.getElementById('form-immunity').value || '-',
                     speed: parseInt(document.getElementById('form-speed').value) || 30,
                     leadership: parseInt(document.getElementById('form-leadership').value) || 0,
                     stats: {
                         str: parseInt(document.getElementById('form-stat-str').value) || 10,
                         dex: parseInt(document.getElementById('form-stat-dex').value) || 10,
                         con: parseInt(document.getElementById('form-stat-con').value) || 10,
                         int: parseInt(document.getElementById('form-stat-int').value) || 10,
                         cha: parseInt(document.getElementById('form-stat-cha').value) || 10,
                     },
                     attacks: [],
                     abilities: Array.from(document.querySelectorAll('#abilities-input-container .ability-input-row')).map(row => ({
                         name: row.querySelector('.form-ability-name').value,
                         desc: row.querySelector('.form-ability-desc').value,
                     })).filter(ability => ability.name || ability.desc),
                     xp: isCreatingNew ? 0 : (bestiary[selectedMonsterName]?.xp || 0) // XP removed, set to 0
                 };
                 // --- End: Сбор данных ИЗ ФОРМЫ ---


                 // --- Start: Handle HP & Attack Damage based on Level/Form ---
                 const hpFromForm = parseInt(document.getElementById('form-hp').value);
                 let finalHp = hpFromForm || levelStats.hp; // Prioritize form HP, fallback to level table

                 const firstAttackRow = document.querySelector('#attacks-input-container .attack-input-row');
                 let firstAttackDamage = levelStats.damage; // Default to level damage
                 let firstAttackType = 'сил'; // Default attack type
                 let firstAttackDesc = 'ближний бой'; // Default description

                 if (firstAttackRow) {
                     const damageFromForm = firstAttackRow.querySelector('.form-attack-damage').value;
                     // Use damage from form if provided
                     if (damageFromForm) {
                         firstAttackDamage = damageFromForm;
                     }
                     // Otherwise, levelStats.damage remains the default

                     firstAttackType = firstAttackRow.querySelector('.form-attack-type').value;
                     firstAttackDesc = firstAttackRow.querySelector('.form-attack-desc').value;
                 }

                 // Apply Orc Warrior damage bonus if applicable and damage wasn't manually entered
                 if (isOrcWarrior && (!firstAttackRow || !firstAttackRow.querySelector('.form-attack-damage').value)) {
                     let damageBonus = 0;
                     if (selectedLevel >= 1 && selectedLevel <= 4) damageBonus = 2;
                     else if (selectedLevel >= 5 && selectedLevel <= 8) damageBonus = 4;
                     else if (selectedLevel >= 9 && selectedLevel <= 14) damageBonus = 8;
                     if (damageBonus > 0) {
                         firstAttackDamage += ` +${damageBonus}`;
                     }
                 }


                 // Add the first attack data
                 formData.attacks.push({
                     type: firstAttackType,
                     damage: firstAttackDamage,
                     desc: firstAttackDesc,
                 });
                 // --- End: Handle HP & Attack Damage ---

                 // --- Start: Apply Orc HP Buffs ---
                 // Apply buff based on the FINAL name determined earlier
                 if (formData.name in orcHpMultiplier) {
                     finalHp = Math.round(finalHp * orcHpMultiplier[formData.name]);
                 }
                 formData.hp = finalHp; // Set the final calculated HP
                 // --- End: Apply Orc HP Buffs ---


                 const monsterData = formData; // Final data to create card

                 const quantity = parseInt(quantityInput.value) || 1;
                 for (let i = 0; i < quantity; i++) {
                     addCard(monsterData);
                 }
            });


            // --- MODAL AND CARD LOGIC ---

            // Debuff related functions removed

            function addCard(monsterData) {
                const cardClone = cardTemplate.content.cloneNode(true);
                const newCard = cardClone.querySelector('.card');
                const monsterNameEl = newCard.querySelector('.monster-name');

                monsterNameEl.textContent = monsterData.name;
                newCard.querySelector('.current-hp').textContent = monsterData.hp;
                newCard.querySelector('.max-hp').textContent = monsterData.hp;
                newCard.dataset.maxHp = monsterData.hp;
                newCard.dataset.currentHp = monsterData.hp;

                // XP display logic removed from addCard

                 // Рассчитываем базовую инициативу
                 const baseInitiative = calculateBaseInitiative(monsterData.stats, monsterData.leadership);
                 // Добавляем случайный модификатор от -3 до +3
                 const initiativeModifier = Math.floor(Math.random() * 7) - 3;
                 const finalInitiative = baseInitiative + initiativeModifier;

                 const initiativeTextElement = newCard.querySelector('.initiative-text');
                 if (initiativeTextElement) {
                    initiativeTextElement.textContent = `Инициатива: ${finalInitiative}`; // Отображаем случайное значение
                 }

                const attacksContainer = newCard.querySelector('.attacks-container');
                attacksContainer.innerHTML = '';
                if(monsterData.attacks && monsterData.attacks.length > 0) {
                    monsterData.attacks.forEach(attack => {
                        const attackTypeName = attackTypeMap[attack.type] || attack.type.toUpperCase();
                        let descClass = '';
                        if (attack.desc.includes('дальний')) { descClass = 'text-green-800 font-semibold'; }
                        else if (attack.desc.includes('Магия')) { descClass = 'text-blue-800 font-semibold'; }
                        attacksContainer.insertAdjacentHTML('beforeend', `<div class="mt-1"><p class="text-center text-xs font-bold">⚔️ Атака (${attackTypeName})</p><div class="flex gap-1"><span class="flex-1 text-center bg-stone-200 rounded p-0.5 text-xs font-bold">${attack.damage}</span><span class="flex-[2] text-center bg-stone-200 rounded p-0.5 text-[11px] ${descClass}">${attack.desc}</span></div></div>`);
                    });
                } else {
                     attacksContainer.insertAdjacentHTML('beforeend', `<p class="text-xs italic text-center text-gray-500">Нет атак</p>`);
                }

                // Debuff button event listener removed

                newCard.querySelector('.delete-button').addEventListener('click', () => {
                    newCard.style.transform = 'scale(0.9)'; newCard.style.opacity = '0';
                    setTimeout(() => newCard.remove(), 300);
                });

                newCard.querySelector('.defeated-overlay').addEventListener('click', () => {
                     newCard.style.transform = 'scale(0.9)'; newCard.style.opacity = '0';
                    setTimeout(() => newCard.remove(), 300);
                });

                newCard.querySelector('.damage-button').addEventListener('click', () => handleHealthChange(newCard, false));
                newCard.querySelector('.heal-button').addEventListener('click', () => handleHealthChange(newCard, true));

                const colorPickerButton = newCard.querySelector('.color-picker-button-oval');
                const paletteContainer = newCard.querySelector('.color-palette');
                Object.entries(colorPalette).forEach(([name, color]) => {
                    const swatch = document.createElement('div');
                    swatch.className = 'color-swatch';
                    swatch.style.backgroundColor = color;
                    swatch.dataset.color = color;
                    swatch.title = name;
                    swatch.addEventListener('click', (e) => {
                        const newColor = e.target.dataset.color;
                        monsterNameEl.style.color = newColor;
                        colorPickerButton.style.backgroundColor = newColor;
                        paletteContainer.style.display = 'none';
                    });
                    paletteContainer.appendChild(swatch);
                });
                 colorPickerButton.addEventListener('click', () => {
                     paletteContainer.style.display = paletteContainer.style.display === 'grid' ? 'none' : 'grid';
                 });

                cardsContainer.appendChild(newCard);
            }

            function handleHealthChange(card, isHealing) {
                const input = card.querySelector('.damage-input');
                const value = parseInt(input.value);
                if (isNaN(value) || value <= 0) return;
                let currentHp = parseInt(card.dataset.currentHp);
                currentHp = isHealing ? currentHp + value : currentHp - value;
                card.dataset.currentHp = currentHp;
                updateHealthUI(card, currentHp);
                input.value = '';
            }

            function updateHealthUI(card, currentHp) {
                const maxHp = parseInt(card.dataset.maxHp);
                card.querySelector('.current-hp').textContent = currentHp;

                const rawPercentage = (currentHp / maxHp) * 100;
                const displayPercentage = Math.min(100, rawPercentage);

                const healthBar = card.querySelector('.health-bar-fill');
                healthBar.style.width = `${displayPercentage > 0 ? displayPercentage : 0}%`;

                if (rawPercentage < 20) {
                    healthBar.style.backgroundColor = '#C53030';
                } else {
                    healthBar.style.backgroundColor = '#4CAF50';
                }

                const defeatedOverlay = card.querySelector('.defeated-overlay');
                if (currentHp <= 0) {
                    card.classList.add('defeated');
                    defeatedOverlay.style.display = 'flex'; // Show overlay
                } else {
                    card.classList.remove('defeated');
                    defeatedOverlay.style.display = 'none'; // Hide overlay
                }
            }


            // Initialize form on load
            clearCreationForm();
             updatePlaceholders(1, ''); // Update placeholders for level 1 initially
        });
    </script>
</body>
</html>
